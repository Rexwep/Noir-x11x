<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#030305"><title>NOIR X11 — Admin</title>
<style>
:root{--bg:#030305;--p:#0b0b10;--l:rgba(255,255,255,.12);--g:#B8FF2C;--m:rgba(255,255,255,.55);color-scheme:dark}
*{box-sizing:border-box;margin:0}body{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#fff;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}.w{max-width:1100px;margin:0 auto;padding:1rem}
.bar{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:1rem 0;border-bottom:1px solid var(--l);margin-bottom:1.2rem}
h1{font-size:1.1rem;letter-spacing:.04em}h1 b{color:var(--g)}
.btn{border:1px solid var(--l);background:var(--p);padding:.6rem 1rem;border-radius:999px;cursor:pointer;transition:.25s}.btn:hover{border-color:var(--g)}
.pri{background:var(--g);color:#050505;border-color:var(--g);font-weight:600}.dng:hover{border-color:#ff5a5a;color:#ff8a8a}
.grid{display:grid;gap:1rem;grid-template-columns:1fr}@media(min-width:860px){.grid{grid-template-columns:1.1fr .9fr}}
.pan{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:1rem}
.row{display:flex;gap:.7rem;align-items:center;padding:.7rem;border:1px solid var(--l);border-radius:14px;margin-bottom:.6rem;background:#08080c}
.row img,.row i{width:84px;height:52px;border-radius:8px;object-fit:cover;flex:none}.row .t{flex:1;min-width:0}.row .t b,.row .t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small,label{color:var(--m);font-size:.8rem}.off{opacity:.5}
label{display:block;margin:.7rem 0 .25rem}input[type=text],input[type=password],textarea{width:100%;background:#050508;border:1px solid var(--l);border-radius:10px;padding:.65rem .8rem;outline:0}
input:focus,textarea:focus{border-color:var(--g)}textarea{min-height:76px;resize:vertical}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}input[type=color]{width:100%;height:42px;background:none;border:1px solid var(--l);border-radius:10px;padding:2px}
.ic{padding:.4rem .7rem}.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
#login{max-width:380px;margin:18vh auto}#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--g);color:#000;padding:.6rem 1.1rem;border-radius:999px;opacity:0;pointer-events:none;transition:.35s}#toast.s{opacity:1;transform:translate(-50%,0)}#toast.e{background:#ff5a5a;color:#fff}
.pv{border:1px solid var(--l);border-radius:14px;overflow:hidden;background:#000;margin-top:1rem}.pv .bd{display:flex;gap:5px;padding:8px 10px;background:#101015;align-items:center;font-size:.72rem;color:var(--m)}.pv .bd s{width:8px;height:8px;border-radius:50%;background:#333;display:block}.pv .bd span{margin-left:8px}
.pv .im{aspect-ratio:16/10;background-size:cover;background-position:top}
</style></head><body>
<div class="w" id="login"><div class="pan"><h1>NOIR <b>X11</b> Admin</h1><label>Password</label><input type="password" id="pw" autocomplete="current-password"><div class="acts"><button class="btn pri" id="go">Sign in</button></div></div></div>
<div class="w" id="app" hidden>
<div class="bar"><h1>NOIR <b>X11</b> · Portfolio manager</h1><div class="acts" style="margin:0"><a class="btn" href="/#/portfolio" target="_blank">View site</a><button class="btn" id="exp">Export</button><label class="btn" style="margin:0;color:#fff">Import<input type="file" id="imp" accept=".json" hidden></label><button class="btn dng" id="out">Sign out</button></div></div>
<div class="grid"><div class="pan"><div class="acts" style="margin:0 0 1rem"><button class="btn pri" id="new">+ Add project</button><small id="cnt" style="align-self:center"></small></div><div id="list"></div></div>
<div class="pan" id="ed" hidden><h1 id="edt">Project</h1>
<label>Project name</label><input type="text" id="name" maxlength="80">
<label>Website URL (leave empty for a design concept)</label><input type="text" id="url" placeholder="https://client-site.com" inputmode="url">
<label>Category</label><input type="text" id="cat" maxlength="80" placeholder="E-commerce · Portfolio · SaaS">
<label>Short description</label><textarea id="desc" maxlength="300"></textarea>
<label>Preview image (optional — otherwise the live website screenshot is used)</label><input type="file" id="file" accept="image/*"><small id="fs"></small>
<div class="c2"><div><label>Concept colour A</label><input type="color" id="c1"></div><div><label>Concept colour B</label><input type="color" id="c2"></div></div>
<label style="display:flex;gap:.5rem;align-items:center;color:#fff"><input type="checkbox" id="pub"> Published on website</label>
<div class="pv"><div class="bd"><s></s><s></s><s></s><span id="pvn">Name</span></div><div class="im" id="pvi"></div></div>
<div class="acts"><button class="btn pri" id="sv">Save project</button><button class="btn dng" id="del">Delete</button></div></div></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);let T=sessionStorage.getItem('t'),L=[],cur=null;
const toast=(m,e)=>{const t=$('#toast');t.textContent=m;t.className='s'+(e?' e':'');clearTimeout(toast.k);toast.k=setTimeout(()=>t.className='',2600)};
const api=async(u,o={})=>{const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T}});const j=await r.json().catch(()=>({}));if(r.status===401&&T){logout(true)}if(!r.ok)throw new Error(j.error||'Error');return j};
const shot=u=>'https://s0.wp.com/mshots/v1/'+encodeURIComponent(u)+'?w=1280&h=800';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function thumb(p){return p.thumb||(p.url?shot(p.url):'')}
function bg(p){return'linear-gradient(135deg,'+p.c1+','+p.c2+')'}
async function boot(){try{L=await api('/api/admin/projects');$('#login').hidden=true;$('#app').hidden=false;draw()}catch{$('#login').hidden=false;$('#app').hidden=true}}
function draw(){$('#cnt').textContent=L.length+' projects';$('#list').innerHTML=L.map((p,i)=>`<div class="row ${p.published?'':'off'}" data-i="${i}">${thumb(p)?`<img loading="lazy" src="${esc(thumb(p))}" alt="">`:`<i style="background:${bg(p)}"></i>`}<div class="t"><b>${esc(p.name)}</b><small>${esc(p.category||'—')}${p.url?'':' · concept'}</small></div><button class="btn ic" data-a="u">↑</button><button class="btn ic" data-a="d">↓</button><button class="btn ic" data-a="e">Edit</button></div>`).join('')||'<small>No projects yet.</small>'}
async function saveAll(){const a=L.map((p,i)=>({...p,order:i+1}));L=await api('/api/admin/projects',{method:'PUT',body:JSON.stringify(a)});draw()}
function open_(p){cur=p;$('#ed').hidden=false;$('#edt').textContent=p._new?'New project':'Edit project';$('#name').value=p.name;$('#url').value=p.url;$('#cat').value=p.category;$('#desc').value=p.description;$('#c1').value=p.c1;$('#c2').value=p.c2;$('#pub').checked=p.published;$('#fs').textContent=p.thumb?'Custom image attached':'';pv();$('#ed').scrollIntoView({behavior:'smooth'})}
function pv(){if(!cur)return;const u=$('#url').value.trim(),fu=u&&!/^https?:\/\//i.test(u)?'https://'+u:u,im=cur.thumb||(fu?shot(fu):'');$('#pvn').textContent=$('#name').value||'Name';$('#pvi').style.backgroundImage=im?`url("${im}")`:bg({c1:$('#c1').value,c2:$('#c2').value})}
['name','url','c1','c2'].forEach(i=>$('#'+i).addEventListener('input',pv));
$('#new').onclick=()=>open_({_new:1,name:'',url:'',category:'',description:'',thumb:'',c1:'#10131c',c2:'#B8FF2C',published:true});
$('#list').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const i=+b.closest('.row').dataset.i,a=b.dataset.a;if(a==='e')return open_({...L[i]});const j=a==='u'?i-1:i+1;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];try{await saveAll();toast('Order saved')}catch(x){toast(x.message,1)}};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=async()=>{const w=Math.min(1280,im.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{const r=await api('/api/admin/upload',{method:'POST',body:JSON.stringify({data:c.toDataURL('image/webp',.86)})});cur.thumb=r.thumb;$('#fs').textContent='Image uploaded';pv()}catch(x){toast(x.message,1)}};im.src=URL.createObjectURL(f)};
$('#sv').onclick=async()=>{if(!$('#name').value.trim())return toast('Enter a project name',1);const p={...cur,name:$('#name').value,url:$('#url').value,category:$('#cat').value,description:$('#desc').value,c1:$('#c1').value,c2:$('#c2').value,published:$('#pub').checked};delete p._new;if(cur._new){p.id='p_'+Math.random().toString(36).slice(2,10);L.push(p)}else L=L.map(x=>x.id===p.id?p:x);try{await saveAll();$('#ed').hidden=true;cur=null;toast('Saved — live on website')}catch(x){toast(x.message,1)}};
$('#del').onclick=async()=>{if(cur._new){$('#ed').hidden=true;return}if(!confirm('Delete "'+cur.name+'"?'))return;L=L.filter(x=>x.id!==cur.id);try{await saveAll();$('#ed').hidden=true;toast('Deleted')}catch(x){toast(x.message,1)}};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(L,null,1)],{type:'application/json'}));a.download='noir-projects.json';a.click()};
$('#imp').onchange=async e=>{try{L=JSON.parse(await e.target.files[0].text());await saveAll();toast('Imported')}catch{toast('Invalid file',1)}};
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})}),j=await r.json();if(!r.ok)throw new Error(j.error);T=j.token;sessionStorage.setItem('t',T);$('#pw').value='';boot()}catch(x){toast(x.message,1)}}
function logout(q){if(!q)api('/api/admin/logout').catch(()=>{});T=null;sessionStorage.removeItem('t');$('#app').hidden=true;$('#login').hidden=false}
$('#go').onclick=login;$('#pw').onkeydown=e=>e.key==='Enter'&&login();$('#out').onclick=()=>logout();T?boot():0;
</script></body></html>
